<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Master chess with AI-powered training. Learn, compete, solve puzzles and improve your game with 25,000+ players on XLChess."
    />
    <meta name="theme-color" content="#0B1023" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="XLChess" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="XLChess - AI-Powered Chess Training" />
    <meta
      property="og:description"
      content="Master chess with AI-powered training. Learn, compete, solve puzzles and improve your game."
    />
    <meta property="og:url" content="https://xlchess.com" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="XLChess" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="XLChess - AI-Powered Chess Training" />
    <meta
      name="twitter:description"
      content="Master chess with AI-powered training. Learn, compete, solve puzzles and improve your game."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="https://xlchess.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <title>XLChess - Master Chess with AI Training</title>

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "XLChess",
        "description": "AI-Powered Chess Training Platform",
        "url": "https://xlchess.com",
        "image": "/og-image.png",
        "applicationCategory": "GameApplication",
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.8",
          "ratingCount": "10000"
        },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Organization",
          "name": "XLChess",
          "url": "https://xlchess.com"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
